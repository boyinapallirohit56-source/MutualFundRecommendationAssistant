<div class="container" style="max-width:700px; margin-top:40px">
  <div class="page-header">
    <h1>Complete Your Profile</h1>
    <p>Help us understand your financial situation</p>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" [style.width.%]="(step / 4) * 100"></div>
  </div>

  <!-- Step 1: Personal -->
  <div class="card" *ngIf="step === 1">
    <h3>Personal Details</h3>
    <div class="grid-2 mt-4">
      <div class="form-group">
        <label>Name</label>
        <input type="text" [value]="userName" disabled style="background:#f3f4f6; color:#6b7280; cursor:not-allowed">
      </div>
      <div class="form-group">
        <label>Age</label>
        <input type="number" [(ngModel)]="profile.age" placeholder="Your age">
      </div>
      <div class="form-group">
        <label>Occupation</label>
        <input type="text" [(ngModel)]="profile.occupation" placeholder="Your occupation">
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" [(ngModel)]="profile.location" placeholder="City">
      </div>
      <div class="form-group">
        <label>Marital Status</label>
        <select [(ngModel)]="profile.maritalStatus">
          <option value="">Select</option>
          <option value="Single">Single</option>
          <option value="Married">Married</option>
        </select>
      </div>
      <div class="form-group">
        <label>Dependents</label>
        <input type="number" [(ngModel)]="profile.dependents" placeholder="0">
      </div>
    </div>
    <button class="btn btn-primary mt-4" (click)="step = 2">Next</button>
  </div>

  <!-- Step 2: Financial -->
  <div class="card" *ngIf="step === 2">
    <h3>Financial Details</h3>
    <div class="grid-2 mt-4">
      <div class="form-group">
        <label>Monthly Income (Rs)</label>
        <input type="number" [(ngModel)]="profile.monthlyIncome" placeholder="50000" min="0">
      </div>
      <div class="form-group">
        <label>Monthly Expenses (Rs)</label>
        <input type="number" [(ngModel)]="profile.monthlyExpenses" placeholder="30000" min="0">
      </div>
      <div class="form-group">
        <label>Savings (Rs)</label>
        <input type="number" [(ngModel)]="profile.savings" placeholder="200000" min="0">
      </div>
      <div class="form-group">
        <label>Loans/EMIs (Rs)</label>
        <input type="number" [(ngModel)]="profile.loans" placeholder="0" min="0">
      </div>
    </div>
    <div style="display:flex; gap:12px" class="mt-4">
      <button class="btn btn-secondary" (click)="step = 1">Back</button>
      <button class="btn btn-primary" (click)="step = 3">Next</button>
    </div>
  </div>

  <!-- Step 3: Investment -->
  <div class="card" *ngIf="step === 3">
    <h3>Investment Details</h3>
    <div class="mt-4">
      <!-- Investment Type -->
      <div class="form-group">
        <label>How do you want to invest?</label>
        <select [(ngModel)]="profile.investmentType">
          <option value="SIP">SIP (Systematic Investment Plan)</option>
          <option value="LumpSum">Lump Sum (One-time)</option>
          <option value="Both">Both SIP + Lump Sum</option>
        </select>
      </div>

      <!-- SIP Section -->
      <div *ngIf="profile.investmentType === 'SIP' || profile.investmentType === 'Both'" class="investment-section">
        <h4>SIP Details</h4>
        <div class="grid-2">
          <div class="form-group">
            <label>SIP Amount (₹)</label>
            <input type="number" [(ngModel)]="profile.sipAmount" placeholder="5000" min="0">
          </div>
          <div class="form-group">
            <label>SIP Frequency</label>
            <select [(ngModel)]="profile.sipFrequency">
              <option value="Weekly">Weekly</option>
              <option value="Monthly">Monthly</option>
              <option value="Quarterly">Quarterly</option>
            </select>
          </div>
          <div class="form-group" *ngIf="profile.sipFrequency === 'Monthly'">
            <label>SIP Date (Day of Month)</label>
            <select [(ngModel)]="profile.sipDate">
              <option [value]="1">1st</option>
              <option [value]="5">5th</option>
              <option [value]="10">10th</option>
              <option [value]="15">15th</option>
              <option [value]="20">20th</option>
              <option [value]="25">25th</option>
            </select>
          </div>
          <div class="form-group" *ngIf="profile.sipFrequency === 'Weekly'">
            <label>SIP Day</label>
            <select [(ngModel)]="profile.sipDate">
              <option [value]="1">Monday</option>
              <option [value]="2">Tuesday</option>
              <option [value]="3">Wednesday</option>
              <option [value]="4">Thursday</option>
              <option [value]="5">Friday</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Lump Sum Section -->
      <div *ngIf="profile.investmentType === 'LumpSum' || profile.investmentType === 'Both'" class="investment-section">
        <h4>Lump Sum Details</h4>
        <div class="form-group">
          <label>Lump Sum Amount (₹)</label>
          <input type="number" [(ngModel)]="profile.lumpSumAmount" placeholder="100000" min="0">
        </div>
      </div>

      <!-- SWP Section -->
      <div class="investment-section">
        <h4>Withdrawal Plan (Optional)</h4>
        <div class="form-group">
          <label>Do you need regular withdrawals (SWP)?</label>
          <select [(ngModel)]="profile.hasSWP">
            <option [ngValue]="false">No</option>
            <option [ngValue]="true">Yes</option>
          </select>
        </div>
        <div class="form-group" *ngIf="profile.hasSWP">
          <label>Monthly Withdrawal Amount (₹)</label>
          <input type="number" [(ngModel)]="profile.swpAmount" placeholder="10000" min="0">
        </div>
      </div>

      <!-- Common -->
      <div class="grid-2">
        <div class="form-group">
          <label>Existing Investments</label>
          <select [(ngModel)]="profile.existingInvestments">
            <option value="">Select</option>
            <option value="None">None</option>
            <option value="FD/RD">FD/RD only</option>
            <option value="Mutual Funds">Mutual Funds</option>
            <option value="Stocks">Direct Stocks</option>
            <option value="Multiple">Multiple types</option>
          </select>
        </div>
        <div class="form-group">
          <label>Investment Duration (Years)</label>
          <input type="number" [(ngModel)]="profile.durationInYears" placeholder="5" min="1">
        </div>
      </div>
    </div>
    <div style="display:flex; gap:12px" class="mt-4">
      <button class="btn btn-secondary" *ngIf="!directStep" (click)="step = 2">Back</button>
      <button class="btn btn-primary" *ngIf="!directStep" (click)="step = 4">Next</button>
      <button class="btn btn-primary" *ngIf="directStep" (click)="saveProfile()" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Save & Return to Dashboard' }}
      </button>
    </div>
  </div>

  <!-- Step 4: Goals -->
  <div class="card" *ngIf="step === 4">
    <h3>Financial Goals</h3>
    <p style="color:var(--text-secondary); margin-top:8px">Select your goals and set target amounts</p>

    <div class="goals-grid mt-4">
      <div class="goal-select-item" *ngFor="let goal of goalOptions">
        <label class="goal-checkbox">
          <input type="checkbox" [checked]="isGoalSelected(goal)" (change)="toggleGoal(goal)">
          {{ goal }}
        </label>
        <div class="goal-target" *ngIf="isGoalSelected(goal)">
          <div class="form-group" style="margin-bottom:8px">
            <label>Target Amount (₹)</label>
            <input type="number" [(ngModel)]="goalTargets[goal]" placeholder="e.g., 5000000" min="1">
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>Timeline (Years)</label>
            <input type="number" [(ngModel)]="goalYears[goal]" placeholder="e.g., 10" min="1">
          </div>
        </div>
      </div>
    </div>

    <div style="display:flex; gap:12px" class="mt-4">
      <button class="btn btn-secondary" (click)="step = 3">Back</button>
      <button class="btn btn-primary" (click)="saveProfile()" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Save & Continue' }}
      </button>
    </div>
  </div>
</div>
